name: Dependabot Auto-merge

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for open Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBERS="$(gh pr list --state open --limit 100 --json number,author --jq '.[] | select(.author.login | startswith("dependabot")) | .number')"
          for pr in $PR_NUMBERS; do
            echo "Enabling auto-merge for PR #${pr}"
            gh pr merge "$pr" --auto --squash || echo "Skipping PR #${pr}: not mergeable/auto-merge not available"
          done
